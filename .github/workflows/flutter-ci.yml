name: Game 007 Flutter test and Android verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate mobile platforms
        run: flutter create --platforms=android,ios --project-name game_007_nonogram_logic .
      - name: Fetch packages
        run: flutter pub get
      - name: Static analyzer
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test
      - name: Android debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: game-007-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=ios,android --project-name game_007_nonogram_logic .
      - run: flutter pub get
      - run: flutter test
      - run: flutter build ios --simulator --no-codesign
